[pytest]
# Default selection: the headless gate. It needs no Bokeh, no built native library,
# no live daemon, no browser and no personal input data. The other suites under
# tests/ are selected explicitly by path, for example
#   python -m pytest tests/execution tests/studio
testpaths =
    tests/science
    tests/io
    tests/workflows

addopts = --strict-markers --strict-config

# Capability markers only, for prerequisites that cut across the directories.
# The directory layout is the categorisation; it is not repeated here.
markers =
    slow: takes more than a few seconds; deselect with -m "not slow".
    requires_input_data: needs a model atmosphere, line list or atom file that the
        repository does not carry; the test states which bundle and how to obtain it.
