[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmulti3d"
version = "0.1.0"
description = "Spectrum synthesis from 1D and 3D model atmospheres in LTE and NLTE: the tumult Python API and TumultStudio"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "AUTHORS"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.60",      # JIT kernels in tumult/auxfuncs.py, _qlg.py
    "astropy>=6.0",     # units, constants, FITS I/O
    "matplotlib>=3.8",
    "cffi>=1.16",       # hopacity binds libhop.so against HOP/standalone/libhop.h
    "tqdm>=4.66",
    "certifi",          # CA bundle for the grid and line-list downloads; python.org macOS builds ship without one
]

[project.optional-dependencies]
gui = ["bokeh>=3.4", "ipykernel>=6.29"]
test = ["pytest>=8.0"]
lint = ["ruff>=0.6"]

# tumult, TumultStudio and hopacity locate libhop.so, dispatch.x and input/ relative to
# the checkout, so install in editable mode: pip install -e ".[gui,test]".  hopacity
# (HOP/hopacity) also builds as a wheel of its own from HOP/pyproject.toml.
[tool.setuptools.packages.find]
where = [".", "HOP"]
include = ["tumult*", "TumultStudio*", "hopacity*"]

[tool.setuptools.package-data]
tumult = ["presets/*.nml", "*.mplstyle", "*.jl", "HOP.jl/**"]
TumultStudio = ["static/**", "templates/**"]

# Rules that find defects (pyflakes, bugbear, import placement, syntax). Style is left to
# docs/PythonNamingConventions.md, whose one-letter comprehension names E741 would flag.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E9", "B"]
# zip(strict=...) would turn silent truncation into errors at many call sites; decide
# per site, not by rule.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# The lambdas there run within the loop iteration that defines them.
"benchmarks/api/run_reference_benchmarks.py" = ["B023"]
