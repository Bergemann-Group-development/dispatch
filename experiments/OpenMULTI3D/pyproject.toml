[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmulti3d"
version = "0.1.0"
description = "Spectrum synthesis from 1D and 3D model atmospheres in LTE and NLTE: the tumult Python API and TumultStudio"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.60",      # JIT kernels in tumult/fast_atom.py, fast_trans.py, physics.py
    "astropy>=6.0",     # units, constants, FITS I/O
    "matplotlib>=3.8",
    "cffi>=1.16",       # tumult/hop.py binds libhop.so against HOP/standalone/libhop.h
    "tqdm>=4.66",
    "certifi",          # CA bundle for the grid and line-list downloads; python.org macOS builds ship without one
]

[project.optional-dependencies]
gui = ["bokeh>=3.4", "ipykernel>=6.29"]
test = ["pytest>=8.0"]

# tumult and TumultStudio locate libhop.so, dispatch.x and input/ relative to the
# checkout, so install in editable mode: pip install -e ".[gui,test]"
[tool.setuptools.packages.find]
include = ["tumult*", "TumultStudio*"]

[tool.setuptools.package-data]
tumult = ["presets/*.nml", "*.mplstyle", "*.jl", "HOP.jl/**"]
TumultStudio = ["static/**", "templates/**"]
