# Builds the Doxygen reference of OpenMULTI3D's Fortran and C sources
# (experiments/OpenMULTI3D/docs/Doxyfile) and publishes it to GitHub Pages.
# Pages must use "GitHub Actions" as its source (Settings > Pages).
name: openmulti3d-docs

on:
  push:
    branches: [main]
    paths:
      - experiments/OpenMULTI3D/SRC/**
      - experiments/OpenMULTI3D/HOP/**
      - experiments/OpenMULTI3D/docs/Doxyfile
      - .github/workflows/openmulti3d-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/OpenMULTI3D
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          curl -sSL https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Run Doxygen
        run: |
          mkdir -p build/doxygen
          doxygen docs/Doxyfile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/OpenMULTI3D/build/doxygen/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
