# This is a sample build configuration for Other.
# Check our guides at https://confluence.atlassian.com/x/5Q4SMw for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: perrybothron/ubuntu-gfortran5-openmpi:16.04-5.4.0-1.10.2

pipelines:
  default:
    - step:
        script:
          - ulimit -s 32768
          - export OMP_STACKSIZE=256m; export OMP_NUM_THREADS=1
          - echo "Run simple tests"
          - cd $BITBUCKET_CLONE_DIR; cd tests/meshes; make clean; make; ./test.x
          - echo "Check compilation of experiments in experiment_list.txt"
          - cd $BITBUCKET_CLONE_DIR; utilities/scripts/validate -v -l -x
          - echo "Validate turbulence experiment"
          - cd $BITBUCKET_CLONE_DIR; utilities/scripts/validate -v experiments/turbulence
          - cd $BITBUCKET_CLONE_DIR; utilities/scripts/validate -v experiments/turbulence/stagger2
          - echo "Everything is awesome!"
