# This is a sample build configuration for Other.
# Check our guides at https://confluence.atlassian.com/x/5Q4SMw for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: perrybothron/ubuntu-gfortran5-openmpi:16.04-5.4.0-1.10.2

pipelines:
  default:
    - step:
        script:
          - export OMP_STACKSIZE=265m; export OMP_NUM_THREADS=1
          - cd $BITBUCKET_CLONE_DIR; utilities/scripts/validate experiments/turbulence/stagger2; cat experiments/turbulence/stagger2/validate/dispatch_gfortran.log
          - cd $BITBUCKET_CLONE_DIR/experiments/turbulence/stagger2/validate; diff ./dispatch_gfortran.val ./dispatch_gfortran.log
